services:
  proxy:
    image: nginx:alpine
    container_name: laba4-proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "80:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
        restart: true
      webmail:
        condition: service_started
        restart: true
    networks:
      - laba4-net

  web:
    build: ./app
    container_name: laba4-web
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: db
      GAME_DB: game
      WEBMAIL_DB: webmail
      DB_USER: user
      DB_PASSWORD: private
      MAIL_DOMAIN: site1.local
      SMTP_HOST: mail
      SMTP_PORT: "25"
      MAIL_FROM: noreply@site1.local
      SECRET_KEY: IliesWilliamMalchazCherif0351
      MAIL_API_KEY: IliesWilliamMalchazCherif0351
    volumes:
      - ./app/index.html:/app/index.html:ro
      - ./mailserver/config:/mailconfig
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
      webmail:
        condition: service_started
    networks:
      - laba4-net

  # Base de données
  db:
    image: mariadb:11.4
    container_name: laba4-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: private
      MARIADB_DATABASE: game
      MARIADB_USER: user
      MARIADB_PASSWORD: private
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-pprivate"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - laba4-net

  # Messagerie
  mail:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: laba4-mail
    hostname: mail.site1.local
    restart: unless-stopped
    environment:
      - OVERRIDE_HOSTNAME=mail.site1.local
      - PERMIT_DOCKER=network
      - SPOOF_PROTECTION=0
      - ENABLE_OPENDKIM=0
      - ENABLE_OPENDMARC=0
      - ENABLE_POLICYD_SPF=0
      - ENABLE_AMAVIS=0
      - ENABLE_CLAMAV=0
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_FAIL2BAN=0
      - SSL_TYPE=manual
      - SSL_CERT_PATH=/tmp/dms/custom-certs/local.crt
      - SSL_KEY_PATH=/tmp/dms/custom-certs/local.key
    volumes:
      - ./mailserver/mail-data:/var/mail
      - ./mailserver/mail-state:/var/mail-state
      - ./mailserver/mail-logs:/var/log/mail
      - ./mailserver/config:/tmp/docker-mailserver
      - ./mailserver/certs:/tmp/dms/custom-certs:ro
      - /etc/localtime:/etc/localtime:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT   # requis par les démons Postfix chrootés
    healthcheck:
      test: "ss --listening --tcp | grep -P 'LISTEN.+:smtp' || exit 1"
      timeout: 3s
      retries: 3
    networks:
      - laba4-net

  webmail:
    image: roundcube/roundcubemail:latest
    container_name: laba4-webmail
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://mail
      - ROUNDCUBEMAIL_DEFAULT_PORT=993
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mail
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_DB_TYPE=mysql
      - ROUNDCUBEMAIL_DB_HOST=db
      - ROUNDCUBEMAIL_DB_PORT=3306
      - ROUNDCUBEMAIL_DB_NAME=webmail
      - ROUNDCUBEMAIL_DB_USER=user
      - ROUNDCUBEMAIL_DB_PASSWORD=private
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload,password
      - MAIL_API_TOKEN=IliesWilliamCherif0351
    volumes:
      - ./mailserver/roundcube/custom.inc.php:/var/roundcube/config/custom.inc.php:ro
    networks:
      - laba4-net

  # Supervision
  monitoring:
    build: ./monitoring
    container_name: laba4-monitoring
    restart: unless-stopped
    env_file:
      - ./monitoring/.env
    networks:
      - laba4-net

volumes:
  db_data:

networks:
  laba4-net:
    name: laba4-net
    driver: bridge
